ibkr:
  host: "localhost"
  port: 4002
  clientId: 1
  port_live: 4001  # IB Gateway live port (7496 is TWS)
  # Time in force of the stop and target attached to every entry. GTC keeps them alive overnight.
  child_tif: "GTC"

market:
  exchange: "SMART"
  currency: "USD"
  timezone: "America/New_York"
  # NYSE holidays and half-days are computed automatically (src/bot/market_calendar.py).
  # List unscheduled closures here, e.g. a national day of mourning: ["2027-01-09"].
  extra_holidays: []
  extra_early_closes: []

account:
  # Fixed budget used for position sizing, in the trading currency.
  # Do not size from the balance IBKR reports: the paper account holds 1,000,000.
  currency: "USD"
  equity: 300

trading:
  # All times are exchange time (market.timezone, New York), so daylight saving needs no adjustment.
  # US regular session: 09:30-16:00 New York, about 15:30-22:00 in Italy.
  windows:
    - start: "09:30"
      end: "12:00"
    - start: "13:30"
      end: "15:50"
  no_trade_windows:
    - start: "12:00"
      end: "13:30"
  flatten_time: "15:55"

costs:
  # Round-trip cost in basis points of the position.
  # US tiered minimum commission is $0.35 per order: $0.70 per round trip, which is
  # 47 bps on the $150 minimum position and 29 bps on the $240 maximum.
  # 50 covers the worst case plus a small allowance for spread. Not yet measured.
  estimated_cost_bps: 50

risk:
  max_concurrent_positions: 1
  max_gross_exposure_pct: 80
  risk_per_trade_pct: 1
  max_daily_loss_pct: 2
  max_trades_per_bot_per_day: 1
  max_order_attempts_per_bot_per_day: 3
  # Position limits in the trading currency (USD)
  min_position_value: 150
  max_position_value: 240

universe:
  - symbol: "INTC"
    name: "Intel"
    strategy: "opening_range"
    priority: 4
    enabled: true
    range_minutes: 15
    target_range_multiple: 2.0

  - symbol: "SOFI"
    name: "SoFi Technologies"
    strategy: "opening_range"
    priority: 3
    enabled: true
    range_minutes: 15
    target_range_multiple: 2.0

  - symbol: "CSCO"
    name: "Cisco Systems"
    strategy: "vwap_reversion"
    priority: 2
    enabled: true
    z_entry: 2.0
    min_bars: 10

  - symbol: "KO"
    name: "Coca-Cola"
    strategy: "vwap_reversion"
    priority: 1
    enabled: true
    z_entry: 2.0
    min_bars: 10

alerts:
  telegram_enabled: false
  telegram_bot_token: ""
  telegram_chat_id: ""

accumulate:
  # Accumulation bot (scripts/accumulate.py): buys SPYL on Xetra with spare EUR cash, never sells.
  symbol: "SPYL"
  exchange: "IBIS2"            # primary listing; orders go through SMART routing
  currency: "EUR"
  fee_estimate: 4.0            # EUR per order; replace with the figure from an IBKR order preview
  max_fee_share: 0.005         # only buy when the fee is at most 0.5% of the order
  cash_reserve: 0.0            # EUR always left in cash
  max_order_value: 2000.0      # EUR cap per order
  limit_buffer: 0.005          # limit price 0.5% above the estimated price
